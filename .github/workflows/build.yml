name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk composition-assistant-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: composition-assistant-apk
          path: composition-assistant-${{ github.run_number }}.apk

      # スマホのブラウザから直接ダウンロードできるよう、Releases にも置く
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 作曲アシスト ビルド ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: composition-assistant-${{ github.run_number }}.apk
          make_latest: true
